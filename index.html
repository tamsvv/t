<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Legacy · Danh sách server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22,.9,.3,1);
    --spring: cubic-bezier(.34,1.4,.5,1);
    --accent: #6ea8ff;
    --accent-2: #3d6df0;
    --text: #f2f4f8;
    --text-2: rgba(242,244,248,.72);
    --text-3: rgba(242,244,248,.46);
    --glass: rgba(255,255,255,.09);
    --glass-hi: rgba(255,255,255,.18);
    --glass-line: rgba(255,255,255,.16);
    --shadow: 0 30px 60px -30px rgba(0,0,0,.55);
    --bg-a: #3b3d42; --bg-b: #1a1b1f; --ridge: #f4f5f7;
    --danger: #ff8a7a;
  }
  :root[data-theme="light"] {
    --text: #161922;
    --text-2: rgba(22,25,34,.72);
    --text-3: rgba(22,25,34,.46);
    --glass: rgba(255,255,255,.42);
    --glass-hi: rgba(255,255,255,.7);
    --glass-line: rgba(255,255,255,.8);
    --shadow: 0 30px 60px -32px rgba(40,44,60,.35);
    --bg-a: #e9eaed; --bg-b: #b9bcc4; --ridge: #ffffff;
    --accent: #2f63e6; --accent-2: #1d4bd0;
    --danger: #c2453a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--sans); color: var(--text); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; background: var(--bg-b); overflow-x: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: color .4s var(--ease);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Nền sóng xám 3D ---------- */
  .scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(180deg, var(--bg-a), var(--bg-b)); transition: background .5s var(--ease); }
  .scene svg { position: absolute; width: 120%; left: -10%; height: 100%; }
  .wave-a { animation: sway 14s ease-in-out infinite alternate; transform-origin: center; }
  .wave-b { animation: sway 18s ease-in-out infinite alternate-reverse; transform-origin: center; }
  @keyframes sway { from { transform: translate3d(-1.5%, 0, 0) scaleY(1); } to { transform: translate3d(1.5%, -2%, 0) scaleY(1.03); } }

  /* ---------- Thanh bên kính cong ---------- */
  .sidebar {
    position: fixed; top: 16px; bottom: 16px; left: 16px; z-index: 30;
    width: 76px; display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 16px 12px; border-radius: 34px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3);
    box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
    transition: width .6s var(--spring), border-radius .6s var(--ease);
    overflow: hidden;
  }
  .sidebar:hover, .sidebar.open { width: 248px; }
  .s-brand { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 4px; white-space: nowrap; }
  .s-logo { flex: none; width: 44px; height: 44px; display: grid; place-items: center; }
  .s-logo svg { width: 38px; height: 38px; }
  .s-label { opacity: 0; transform: translateX(-8px); transition: opacity .35s var(--ease), transform .45s var(--ease); white-space: nowrap; }
  .sidebar:hover .s-label, .sidebar.open .s-label { opacity: 1; transform: none; transition-delay: .08s; }
  .s-brand .s-label { font-weight: 700; letter-spacing: -.01em; font-size: 1.05rem; }
  .s-brand .s-label small { display: block; font-weight: 500; font-size: .75rem; color: var(--text-3); }

  .nav { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .nav button {
    position: relative; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px;
    border: 0; background: transparent; border-radius: 18px; cursor: pointer; text-align: left;
    color: var(--text-2); white-space: nowrap; overflow: hidden;
    transition: background-color .3s var(--ease), color .3s var(--ease), transform .4s var(--spring);
  }
  .nav button:hover { background: var(--glass-hi); color: var(--text); }
  .nav button:active { transform: scale(.96); }
  .nav button.on { background: var(--glass-hi); color: var(--text); box-shadow: inset 0 0 0 1px var(--glass-line); }
  .nav button.on::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent); animation: bar-in .5s var(--spring); }
  @keyframes bar-in { from { transform: scaleY(0); } }
  .nav svg { width: 22px; height: 22px; flex: none; transition: transform .5s var(--spring); }
  .nav button:hover svg { transform: scale(1.12) rotate(-6deg); }
  .nav .count { margin-left: auto; font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--text-3); }
  .s-spacer { flex: 1; }
  .s-foot { display: flex; flex-direction: column; gap: 6px; }
  .s-crystal { height: 110px; display: grid; place-items: center; margin-bottom: 4px; }
  .s-crystal svg { width: 84px; height: 84px; overflow: visible; animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }

  /* ---------- Vùng nội dung ---------- */
  .main { margin-left: 108px; padding: 40px 40px 80px 0; max-width: 1280px; transition: margin-left .6s var(--spring); }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
  .title-wrap { opacity: 0; transform: translateY(16px); animation: enter .9s var(--ease) .1s forwards; }
  .eyebrow { font-size: .85rem; color: var(--text-3); margin: 0 0 6px; }
  h1 { font-size: clamp(2.2rem, 4.6vw, 3.4rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.02; margin: 0; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; opacity: 0; animation: enter .9s var(--ease) .35s forwards; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: .85rem; color: var(--text-2); }
  .chip b { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .chip .dot.off { background: var(--text-3); box-shadow: none; }

  /* Thẻ nổi bật: server mới nhất */
  .feature {
    position: relative; overflow: hidden; border-radius: 34px; padding: 32px 36px; margin-bottom: 28px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3);
    box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
    display: grid; grid-template-columns: minmax(0,1fr) 220px; gap: 24px; align-items: center;
    opacity: 0; transform: translateY(28px) scale(.98); animation: enter 1s var(--ease) .5s forwards;
  }
  .feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, var(--glass-hi) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 2.6s var(--ease) 1.4s 1; pointer-events: none; }
  @keyframes sheen { to { transform: translateX(120%); } }
  @keyframes enter { to { opacity: 1; transform: none; } }
  .feature .no { font-size: .8rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .feature h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin: 8px 0 10px; word-break: break-word; }
  .feature p { color: var(--text-2); margin: 0 0 20px; max-width: 46ch; }
  .feature-visual { display: grid; place-items: center; height: 170px; }
  .feature-visual svg { width: 170px; height: 170px; overflow: visible; animation: spin3d 9s ease-in-out infinite; }
  @keyframes spin3d { 0%,100% { transform: rotateY(0) rotateX(0); } 50% { transform: rotateY(40deg) rotateX(-12deg); } }

  /* Nút */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); color: var(--text); font-weight: 600; font-size: .92rem; cursor: pointer; white-space: nowrap; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: transform .4s var(--spring), background-color .3s var(--ease), box-shadow .4s var(--ease), border-color .3s; }
  .btn:hover { background: var(--glass-hi); transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(0,0,0,.5); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 12px 28px -12px var(--accent-2), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.primary:hover { box-shadow: 0 18px 36px -12px var(--accent-2), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.sm { height: 36px; padding: 0 16px; font-size: .85rem; }
  .btn.icon { width: 42px; padding: 0; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .ripple { position: absolute; border-radius: 50%; background: #fff; opacity: .35; transform: scale(0); pointer-events: none; animation: ripple .7s var(--ease) forwards; }
  @keyframes ripple { to { transform: scale(3); opacity: 0; } }

  /* Thanh công cụ */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; opacity: 0; animation: enter .8s var(--ease) .65s forwards; }
  .search { position: relative; flex: 1 1 280px; max-width: 420px; }
  .search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--text-3); pointer-events: none; }
  .field { height: 44px; width: 100%; padding: 0 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: .92rem; transition: box-shadow .35s var(--ease), border-color .3s, background-color .3s; }
  .search .field { padding-left: 44px; }
  .field::placeholder { color: var(--text-3); }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  select.field { width: auto; padding-right: 36px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
  textarea.field { height: auto; padding: 12px 16px; border-radius: 22px; min-height: 90px; resize: vertical; }

  /* Lưới thẻ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card {
    position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
    padding: 24px; border-radius: 30px; min-height: 220px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
    opacity: 0; transform: translateY(26px) scale(.97);
    transition: opacity .8s var(--ease), transform .8s var(--ease), box-shadow .5s var(--ease), background-color .4s;
  }
  .card.in { opacity: 1; transform: none; }
  .card.in:hover { transform: translateY(-6px) scale(1.01); transition: transform .5s var(--spring), box-shadow .5s var(--ease); box-shadow: 0 40px 70px -34px rgba(0,0,0,.6), inset 0 1px 0 var(--glass-hi); }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, var(--glass-hi) 50%, transparent 65%); transform: translateX(-120%); transition: transform 1s var(--ease); pointer-events: none; }
  .card.in:hover::after { transform: translateX(120%); }
  .card.leaving { opacity: 0; transform: scale(.92) translateY(-8px); transition: opacity .35s var(--ease), transform .35s var(--ease); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pill { font-size: .75rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--glass-hi); border: 1px solid var(--glass-line); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .host { font-size: .78rem; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .card-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 8px 0 0; word-break: break-word; }
  .card-desc { color: var(--text-2); font-size: .92rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 4.1em; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
  .go { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--text); color: var(--bg-b); font-weight: 600; font-size: .88rem; text-decoration: none; transition: transform .4s var(--spring), background-color .3s; }
  .go:hover { transform: translateX(3px); }
  .go svg { width: 14px; height: 14px; transition: transform .4s var(--spring); }
  .go:hover svg { transform: translate(2px, -2px); }

  .skeleton { height: 220px; border-radius: 30px; border: 1px solid var(--glass-line); background: linear-gradient(100deg, var(--glass) 30%, var(--glass-hi) 50%, var(--glass) 70%); background-size: 220% 100%; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -220% 0; } }

  .empty { text-align: center; padding: 64px 24px; border-radius: 30px; background: var(--glass); border: 1px dashed var(--glass-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .empty h3 { font-size: 1.3rem; margin: 0 0 6px; }
  .empty p { margin: 0; color: var(--text-2); }
  .notice { margin-top: 18px; padding: 14px 18px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--text-2); font-size: .9rem; }

  /* Thông báo */
  .toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60; display: grid; gap: 10px; justify-items: end; }
  .toast { padding: 13px 18px; border-radius: 999px; background: var(--glass-hi); border: 1px solid var(--glass-line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow); font-size: .9rem; font-weight: 500; animation: toast-in .6s var(--spring) both; }
  .toast.out { animation: toast-out .35s var(--ease) forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(30px) scale(.9); } }
  @keyframes toast-out { to { opacity: 0; transform: translateX(30px) scale(.9); } }

  /* Nút đổi giao diện: xoay mặt trăng */
  .theme-ico { transition: transform .8s var(--spring); }
  #themeBtn.flip .theme-ico { transform: rotate(200deg); }

  /* ---------- Di động: thanh bên thành dải dưới ---------- */
  /* ---------- Lớp chuyển động ---------- */
  .sidebar { animation: side-in 1s var(--spring) both; }
  @keyframes side-in { from { opacity: 0; transform: translateX(-120%); } }
  .s-logo svg { animation: pop-spin 1.1s var(--spring) .3s backwards; }
  @keyframes pop-spin { from { opacity: 0; transform: scale(.2) rotate(-200deg); } }
  .nav button { animation: nav-in .7s var(--ease) backwards; }
  .nav button:nth-child(1) { animation-delay: .45s; }
  .nav button:nth-child(2) { animation-delay: .55s; }
  .nav button:nth-child(3) { animation-delay: .65s; }
  .nav button:nth-child(4) { animation-delay: .75s; }
  @keyframes nav-in { from { opacity: 0; transform: translateX(-18px); } }
  .s-crystal { animation: float 5s ease-in-out infinite; }
  .s-crystal svg { animation: spin-y 9s linear infinite; }
  @keyframes spin-y { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

  h1 .ch { display: inline-block; white-space: pre; transform-origin: 50% 100%; animation: ch-in .9s var(--spring) backwards; animation-delay: calc(var(--i) * 45ms + 250ms); }
  @keyframes ch-in { from { opacity: 0; transform: translateY(.5em) rotateX(-80deg); } }

  .chip-row .chip { animation: pop-in .7s var(--spring) backwards; }
  .chip-row .chip:nth-child(1) { animation-delay: .5s; }
  .chip-row .chip:nth-child(2) { animation-delay: .6s; }
  .chip-row .chip:nth-child(3) { animation-delay: .7s; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.7) translateY(8px); } }

  .feature-visual { perspective: 700px; }
  .feature-visual svg { animation: spin-y 7s linear infinite; }

  .mote { position: absolute; bottom: -20px; width: var(--s, 4px); height: var(--s, 4px); border-radius: 50%; background: var(--accent); opacity: 0; animation: rise var(--t, 14s) linear var(--dl, 0s) infinite; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .55; } 90% { opacity: .35; } 100% { transform: translate(var(--dx, 30px), -110vh); opacity: 0; } }

  .card { transition: transform .5s var(--spring), box-shadow .5s var(--ease), opacity .6s var(--ease), border-color .3s; }
  .card.in { animation: card-in .9s var(--ease) backwards; animation-delay: var(--d, 0ms); }
  @keyframes card-in { from { opacity: 0; transform: translateY(40px) scale(.94); } }
  .card.in:hover { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-6px); }
  .card::after { transform: none; opacity: 0; background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%), var(--glass-hi), transparent 60%); transition: opacity .4s var(--ease); }
  .card.in:hover::after { transform: none; opacity: 1; }

  .btn { isolation: isolate; }
  .btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s var(--ease); pointer-events: none; border-radius: inherit; }
  .btn:hover::after { transform: translateX(120%); }

  .search { transition: max-width .5s var(--spring); }
  .search:focus-within { max-width: 540px; }

  /* ---------- Vòng hai: chuyển động tinh chỉnh ---------- */
  .nav { position: relative; }
  .nav button { z-index: 1; }
  .nav button.on { background: transparent; box-shadow: none; }
  .nav-ind { position: absolute; z-index: 0; border-radius: 18px; background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--glass-line); pointer-events: none; transition: left .6s var(--spring), top .6s var(--spring), width .6s var(--spring), height .6s var(--spring); }
  .nav button.on:hover { background: transparent; }

  .feature > * { position: relative; z-index: 1; }
  .feature::before { content: ""; position: absolute; inset: 0; z-index: 0; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--glass-hi), transparent 60%); opacity: 0; transition: opacity .5s var(--ease); pointer-events: none; }
  .feature:hover::before { opacity: 1; }

  #skeletons { transition: opacity .35s var(--ease); }
  #skeletons.out { opacity: 0; }

  .empty:not([hidden]), .notice:not([hidden]) { animation: pop-in .7s var(--spring) backwards; }

  .toast { position: relative; overflow: hidden; }
  .toast::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); transform-origin: left; animation: shrink 2.8s linear forwards; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  #scene svg { transition: transform .9s var(--ease); }
  .s-crystal:hover svg { animation-duration: 2.2s; }

  @media (max-width: 860px) {
    .scene { opacity: .55; }
    .sidebar { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; height: 72px; flex-direction: row; justify-content: space-around; padding: 10px 12px; border-radius: 30px; }
    .sidebar:hover, .sidebar.open { width: auto; }
    .s-brand, .s-crystal, .s-spacer, .s-foot .s-label { display: none; }
    .nav { flex-direction: row; margin: 0; gap: 2px; width: 100%; justify-content: space-around; }
    .nav button { width: 52px; height: 48px; justify-content: center; padding: 0; }
    .nav .s-label, .nav .count { display: none; }
    .nav button.on::before { display: none; }
    .s-foot { flex-direction: row; }
    .main { margin-left: 0; padding: 24px 18px 140px; }
    .feature { grid-template-columns: 1fr; padding: 26px; }
    .feature-visual { display: none; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search { max-width: none; flex: none; }
    select.field { width: 100%; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .title-wrap, .chip-row, .feature, .toolbar, .card { opacity: 1 !important; transform: none !important; }
  }

  /* ---------- Vòng ba: hệ thống bo góc, khoảng cách, chuyển động ---------- */
  :root { --r-xl: 32px; --r-lg: 28px; --r-md: 20px; --r-sm: 14px; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 40px; }
  body { font-feature-settings: "ss01", "cv11"; text-rendering: optimizeLegibility; }
  h1, h2, h3, .card-title { text-wrap: balance; }
  p, .card-desc { text-wrap: pretty; }
  .sidebar { border-radius: var(--r-xl); padding: var(--sp-3); gap: var(--sp-2); }
  .nav button { border-radius: var(--r-md); height: 48px; padding: 0 var(--sp-4); }
  .nav-ind { border-radius: var(--r-md); }
  .feature { border-radius: var(--r-xl); padding: var(--sp-6) var(--sp-7); gap: var(--sp-5); margin-bottom: var(--sp-5); }
  .card { border-radius: var(--r-lg); padding: var(--sp-5); gap: var(--sp-3); }
  .skeleton, .empty { border-radius: var(--r-lg); }
  .notice { border-radius: var(--r-md); }
  .grid { gap: var(--sp-5); }
  .topline { align-items: flex-end; margin-bottom: var(--sp-7); gap: var(--sp-5); }
  .toolbar { margin-bottom: var(--sp-5); }
  .btn, .go, .field, .chip, .toast { height: 44px; }
  .chip { height: 36px; }
  .go { padding: 0 var(--sp-5); }
  .pill { line-height: 1; padding: 7px 12px; }
  .card-title { margin-top: var(--sp-2); }
  .card-foot { padding-top: var(--sp-2); border-top: 1px solid var(--glass-line); }

  .eyebrow { display: inline-flex; align-items: center; gap: var(--sp-2); letter-spacing: .04em; text-transform: uppercase; font-size: .75rem; font-weight: 600; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: ping 2s var(--ease) infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  h1 { padding-bottom: var(--sp-3); position: relative; }
  h1::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 72px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), transparent); transform-origin: left; animation: draw 1.2s var(--ease) 1s backwards; }
  @keyframes draw { from { transform: scaleX(0); } }

  /* Nền: quầng sáng trôi + vệt sáng theo con trỏ + hạt nổi */
  .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35; pointer-events: none; will-change: transform; }
  .aurora.a1 { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: var(--accent); animation: drift 22s ease-in-out infinite alternate; }
  .aurora.a2 { width: 38vw; height: 38vw; right: -8vw; bottom: -10vw; background: var(--accent-2); animation: drift 28s ease-in-out infinite alternate-reverse; }
  .aurora.a3 { width: 26vw; height: 26vw; left: 40vw; top: 30vh; background: #8a7bff; opacity: .18; animation: drift 34s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vw, 5vh, 0) scale(1.18); } }
  .spot { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(520px circle at var(--px, 50%) var(--py, 30%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%); transition: background .2s linear; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 70; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform-origin: left; transform: scaleX(0); }

  /* Viền sáng xoay quanh thẻ khi rê chuột */
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .card::before, .feature .glow { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease);
    background: conic-gradient(from var(--ang), transparent 0 60%, var(--accent) 80%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin-ang 3.5s linear infinite; }
  .card:hover::before, .feature:hover .glow { opacity: 1; }
  @keyframes spin-ang { to { --ang: 360deg; } }
  .feature .glow { z-index: 2; }

  /* Tinh chỉnh nút, ô nhập, thẻ nổi bật */
  .btn, .go { will-change: transform; }
  .go { box-shadow: 0 10px 24px -14px rgba(0,0,0,.6); }
  .go svg { flex: none; }
  .feature-visual::before { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 1px solid var(--glass-line); animation: ring 3.2s var(--ease) infinite; }
  .feature-visual::after { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 1px solid var(--glass-line); animation: ring 3.2s var(--ease) 1.6s infinite; }
  .feature-visual { position: relative; }
  @keyframes ring { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  .feature h2 { margin: var(--sp-2) 0 var(--sp-3); }
  .feature p { margin-bottom: var(--sp-5); }
  .reveal { opacity: 0; transform: translateY(14px); animation: enter .8s var(--ease) forwards; }
  .toasts { right: var(--sp-5); bottom: var(--sp-5); }
  .s-label, .nav .count { line-height: 1; }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }

  @media (max-width: 860px) {
    .topline { margin-bottom: var(--sp-5); }
    .feature { padding: var(--sp-5); }
    .card { padding: var(--sp-5); }
    .aurora { filter: blur(60px); }
  }
  @media (prefers-reduced-motion: reduce) { .aurora, .spot, .progress, .eyebrow::before, h1::after { animation: none !important; } }
  /* ---------- Tối ưu hiệu năng (giữ nguyên giao diện) ---------- */
  .scene { contain: layout paint style; }
  .parallax { position: absolute; inset: 0; will-change: transform; transition: transform .9s var(--ease); }
  #scene svg { transition: none; }
  .wave { will-change: transform; transform-origin: 50% 100%; }
  .wave-a { animation: wv-a 11s ease-in-out infinite; }
  .wave-b { animation: wv-b 15s ease-in-out infinite; }
  @keyframes wv-a { 0%,100% { transform: translate3d(0,0,0) scaleY(1); } 50% { transform: translate3d(2.2%,-4%,0) scaleY(1.07); } }
  @keyframes wv-b { 0%,100% { transform: translate3d(0,0,0) scaleY(1); } 50% { transform: translate3d(-2.6%,5%,0) scaleY(.94); } }

  .aurora { filter: none; will-change: transform; }
  .aurora.a1 { width: 58vw; height: 58vw; left: -16vw; top: -20vw; background: radial-gradient(closest-side, var(--accent) 25%, transparent); }
  .aurora.a2 { width: 48vw; height: 48vw; right: -14vw; bottom: -16vw; background: radial-gradient(closest-side, var(--accent-2) 25%, transparent); }
  .aurora.a3 { width: 34vw; height: 34vw; left: 36vw; top: 26vh; background: radial-gradient(closest-side, #8a7bff 25%, transparent); }
  .spot { left: 0; top: 0; right: auto; bottom: auto; width: 1040px; height: 1040px; inset: 0 auto auto 0; background: radial-gradient(circle closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%); transition: none; transform: translate3d(calc(50vw - 520px), calc(30vh - 520px), 0); will-change: transform; }
  .progress, .mote { will-change: transform, opacity; }
  .s-crystal svg, .feature-visual svg { will-change: transform; }
  body.scrolling .aurora, body.scrolling .wave, body.scrolling .mote { animation-play-state: paused; }

  .card::before, .feature .glow { animation: none; }
  .card:hover::before, .feature:hover .glow { animation: spin-ang 3.5s linear infinite; }

  /* Logo + tên */
  .s-logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 0 0 2px var(--glass-line), 0 8px 20px -8px rgba(0,0,0,.6); animation: pop-spin 1.1s var(--spring) .3s backwards; transition: transform .6s var(--spring); }
  .sidebar:hover .s-logo img { transform: rotate(-8deg) scale(1.06); }
  .m-brand { display: none; }
  @media (max-width: 860px) {
    .m-brand { display: inline-flex; align-items: center; gap: var(--sp-2); position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 18px; z-index: 25; height: 40px; padding: 0 var(--sp-4) 0 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: .85rem; letter-spacing: -.01em; animation: pop-in .8s var(--spring) .3s backwards; }
    .m-brand img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .main { padding-top: 76px; }
    .aurora.a3, .mote:nth-child(n+10) { display: none; }
    .sidebar, .feature, .card, .chip, .field, .empty, .notice, .toast { backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
  }
</style>
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>
<div class="spot" id="spot" aria-hidden="true"></div>
<div class="scene" aria-hidden="true" id="scene">
  <i class="aurora a1"></i><i class="aurora a2"></i><i class="aurora a3"></i>
  <div class="parallax" id="parallax">
    <svg class="wave wave-a" viewBox="0 0 1440 900" preserveAspectRatio="none"><defs>
      <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--bg-a)" stop-opacity=".2"/>
        <stop offset="1" stop-color="var(--bg-b)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8a8d95"/>
        <stop offset=".5" stop-color="#d7d9de"/>
        <stop offset="1" stop-color="#6b6e76"/>
      </linearGradient>
    </defs><path fill="url(#gA)" opacity=".8" d="M0 360 C260 250 420 470 760 390 C1040 330 1200 180 1440 260 L1440 900 L0 900 Z"/><path fill="none" stroke="url(#gB)" stroke-width="3" opacity=".7" d="M0 380 C260 270 420 490 760 410 C1040 350 1200 200 1440 280"/></svg>
    <svg class="wave wave-b" viewBox="0 0 1440 900" preserveAspectRatio="none"><path fill="var(--bg-b)" opacity=".55" d="M0 520 C300 420 520 640 860 540 C1100 470 1260 360 1440 430 L1440 900 L0 900 Z"/><path fill="none" stroke="var(--ridge)" stroke-width="2" opacity=".5" d="M0 540 C300 440 520 660 860 560 C1100 490 1260 380 1440 450"/></svg>

</div>

<script>
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DAY = 86400000;
  // Server mặc định: luôn hiển thị ở đầu danh sách và trên thẻ nổi bật.
  // Muốn đổi, sửa trực tiếp link ở đây.
  const DEFAULT_SERVER = {
    id: "default",
    title: "King Legacy",
    desc: "Server mặc định",
    url: "https://www.roblox.com/vi/games/4520749081/King-Legacy?privateServerLinkCode=89635384574836710815765745912912&zdlink=Uo9fRtCYEdiYSsDePMrbNtLoR28w8dfXR6yjD3CnEJGsCJKoEbmlN2yYB29XS71fP28w8ZGpCJaqDZ4rCY9zVG",
    builtin: true
  };

  let db = null, items = [], loaded = false, filter = "all", syncTimer = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const hostOf = (u) => { try { return new URL(u).hostname; } catch (_) { return ""; } };
  // Đổi link Roblox trên web thành link mở thẳng game trong ứng dụng Roblox.
  // Trả về null nếu không phải link game Roblox.
  function gameLinks(url) {
    if (!/roblox\.com/i.test(url)) return null;
    const pid = (url.match(/\/games\/(\d+)/) || [])[1];
    if (!pid) return null;
    const code = (url.match(/[?&](?:privateServerLinkCode|linkCode)=([^&#]+)/) || [])[1];
    return { app: `roblox://placeId=${pid}${code ? `&linkCode=${code}` : ""}`, web: url };
  }
  const pad = (n) => String(n).padStart(3, "0");
  const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>`;

  // Thanh bên mở khi bấm (cho màn hình cảm ứng)
  $("#sidebar").addEventListener("click", (e) => {
    if (matchMedia("(hover: none)").matches && !e.target.closest("button")) $("#sidebar").classList.toggle("open");
  });

  // ---- Gợn sóng khi bấm ----
  document.addEventListener("pointerdown", (e) => {
    const btn = e.target.closest(".btn, .nav button");
    if (!btn || reduceMotion) return;
    const r = btn.getBoundingClientRect();
    const s = Math.max(r.width, r.height);
    const el = document.createElement("span");
    el.className = "ripple";
    el.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    btn.appendChild(el);
    setTimeout(() => el.remove(), 750);
  });

  // ---- Thẻ hiện ra khi cuộn tới ----
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: .1, rootMargin: "0px 0px -30px 0px" });

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    $("#toasts").appendChild(t);
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 350); }, 2800);
  }
  function notice(msg) { const n = $("#notice"); n.textContent = msg; n.hidden = false; }

  // ---- Đổi giao diện ----
  $("#themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
    $("#themeBtn").classList.toggle("flip");
  });

  // ---- Bộ lọc thanh bên ----
  $$(".nav button[data-filter]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    $$(".nav button[data-filter]").forEach(x => x.classList.toggle("on", x === b));
    moveNavInd();
    render();
    replayCards();
  }));

  // ---- Hiển thị ----
  function catalogueNumbers() {
    const asc = [...items].sort((a, b) => (a.createdAt ?? 0) - (b.createdAt ?? 0));
    return new Map(asc.map((it, i) => [it.id, i + 1]));
  }

  function visibleItems() {
    const q = $("#search").value.trim().toLowerCase();
    const sort = $("#sort").value;
    const now = Date.now();
    const rest = items
      .filter(it => it.title.toLowerCase().includes(q))
      .filter(it => filter !== "new" || now - (it.createdAt ?? 0) < 7 * DAY)
      .sort((a, b) => {
        if (sort === "name") return a.title.localeCompare(b.title, "vi");
        if (sort === "oldest") return (a.createdAt ?? 0) - (b.createdAt ?? 0);
        return (b.createdAt ?? 0) - (a.createdAt ?? 0);
      });
    const showDefault = filter !== "new" && DEFAULT_SERVER.title.toLowerCase().includes(q);
    return showDefault ? [DEFAULT_SERVER, ...rest] : rest;
  }

  function countTo(el, to, suffix = "") {
    if (el.textContent === to + suffix) return;
    if (reduceMotion) { el.textContent = to + suffix; return; }
    const from = parseInt(el.textContent) || 0;
    const start = performance.now(), dur = 800;
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3))) + suffix;
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function updateStats() {
    const now = Date.now();
    const newCount = items.filter(it => now - (it.createdAt ?? 0) < 7 * DAY).length;
    const total = items.length + 1;
    countTo($("#statTotal"), total);
    countTo($("#statNew"), newCount);
    countTo($("#cntAll"), total);
    countTo($("#cntNew"), newCount);
    if (!items.length) { $("#statLast").textContent = "—"; return; }
    const latest = Math.max(...items.map(it => it.createdAt ?? 0));
    const mins = Math.floor((now - latest) / 60000);
    $("#statLast").textContent = mins < 1 ? "Vừa xong" : mins < 60 ? `${mins} phút` : mins < 1440 ? `${Math.floor(mins / 60)} giờ` : `${Math.floor(mins / 1440)} ngày`;
  }

  // Thẻ nổi bật: server mới nhất
  function renderFeature() {
    const feat = $("#feature");
    feat.hidden = false;
    $("#fNo").textContent = "Mặc định";
    $("#featTitle").textContent = DEFAULT_SERVER.title;
    $("#featDesc").textContent = DEFAULT_SERVER.desc;
    const link = $("#fLink");
    link.href = DEFAULT_SERVER.url;
    const g = gameLinks(DEFAULT_SERVER.url);
    if (g) link.dataset.app = g.app; else delete link.dataset.app;
  }

  function cardHTML(it, nums) {
    const safe = /^https:\/\//i.test(it.url) ? esc(it.url) : "#";
    const g = gameLinks(it.url);
    const appAttr = g ? ` data-app="${esc(g.app)}"` : "";
    const tag = it.builtin ? "Mặc định" : `No. ${pad(nums.get(it.id) ?? 0)}`;
    return `
      <div class="card-top">
        <span class="pill">${tag}</span>
        <span class="host">${esc(hostOf(it.url))}</span>
      </div>
      <h3 class="card-title">${esc(it.title)}</h3>
      <p class="card-desc">${esc(it.desc)}</p>
      <div class="card-foot">
        <a class="go" href="${safe}"${appAttr} target="_blank" rel="noopener">Vào server ${ARROW}</a>
      </div>`;
  }

  // ---- Chỉ báo menu, skeleton, tilt thẻ, chạy lại hiệu ứng ----
  function moveNavInd() {
    const b = $(".nav button.on");
    const ind = $("#navInd");
    if (!b || !ind) return;
    ind.style.left = b.offsetLeft + "px";
    ind.style.top = b.offsetTop + "px";
    ind.style.width = b.offsetWidth + "px";
    ind.style.height = b.offsetHeight + "px";
  }

  function hideSkeleton() {
    const s = $("#skeletons");
    if (s.hidden || s.classList.contains("out")) return;
    s.classList.add("out");
    setTimeout(() => { s.hidden = true; s.classList.remove("out"); }, 350);
  }

  function bindCard(card) {
    let raf = 0, ev = null;
    card.addEventListener("pointermove", (e) => {
      if (reduceMotion || e.pointerType !== "mouse") return;
      ev = e; if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const r = card.getBoundingClientRect();
        const px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
        card.style.setProperty("--ry", ((px - .5) * 10).toFixed(2) + "deg");
        card.style.setProperty("--rx", ((.5 - py) * 10).toFixed(2) + "deg");
        card.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
        card.style.setProperty("--my", (py * 100).toFixed(1) + "%");
      });
    }, { passive: true });
    card.addEventListener("pointerleave", () => {
      card.style.setProperty("--rx", "0deg");
      card.style.setProperty("--ry", "0deg");
    });
  }

  function replayCards() {
    if (reduceMotion) return;
    const cards = $$("#grid .card");
    cards.forEach((c, i) => { c.classList.remove("in"); c.style.setProperty("--d", (i % 8) * 70 + "ms"); });
    void document.body.offsetWidth;
    cards.forEach(c => c.classList.add("in"));
  }

  function render() {
    updateStats();
    hideSkeleton();

    const nums = catalogueNumbers();
    renderFeature();

    const grid = $("#grid");
    const list = visibleItems();
    const existing = new Map([...grid.children].map(el => [el.dataset.id, el]));
    const keep = new Set(), order = [];

    list.forEach((it, idx) => {
      keep.add(it.id);
      let card = existing.get(it.id);
      if (!card) {
        card = document.createElement("article");
        card.className = "card";
        card.dataset.id = it.id;
        bindCard(card);
        card.style.setProperty("--d", (idx % 8) * 80 + "ms");
        if (reduceMotion) card.classList.add("in"); else io.observe(card);
      }
      const html = cardHTML(it, nums);
      if (card._html !== html) { card.innerHTML = html; card._html = html; }
      order.push(card);
    });
    [...grid.children].forEach(el => { if (!keep.has(el.dataset.id)) el.remove(); });
    let ref = grid.firstElementChild;
    order.forEach(c => { if (c === ref) ref = ref.nextElementSibling; else grid.insertBefore(c, ref); });

    grid.hidden = list.length === 0;
    $("#empty").hidden = list.length !== 0;
    if (list.length === 0) {
      const searching = $("#search").value.trim() !== "" || filter !== "all";
      $("#emptyTitle").textContent = searching ? "Không tìm thấy" : "Chưa có server nào";
      $("#emptyText").textContent = searching ? "Thử từ khoá hoặc bộ lọc khác." : "Server mới sẽ xuất hiện tại đây.";
    }
  }

  // Mở thẳng game trong ứng dụng Roblox. Nếu ứng dụng không mở, chuyển sang trang web.
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-app]");
    if (!a || !a.dataset.app) return;
    e.preventDefault();
    const web = a.href;
    const app = a.dataset.app;
    const fallback = setTimeout(() => {
      toast("Chưa mở được ứng dụng Roblox, chuyển sang trang web");
      window.open(web, "_blank", "noopener");
    }, 1500);
    const cancel = () => clearTimeout(fallback);
    document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); }, { once: true });
    window.addEventListener("blur", cancel, { once: true });
    const link = document.createElement("a");
    link.href = app;
    link.target = "_top";
    link.rel = "noopener";
    document.body.appendChild(link);
    link.click();
    link.remove();
  });

  let searchT;
  $("#search").addEventListener("input", () => { clearTimeout(searchT); searchT = setTimeout(render, 120); });
  $("#sort").addEventListener("change", () => { render(); replayCards(); });
  setInterval(updateStats, 60000);

  // ---- Kết nối dữ liệu ----
  async function connect() {
    // Chờ tối đa 8 giây để lấy kết nối dữ liệu, sau đó vẫn hiện server mặc định
    const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 8000));
    try {
      db = await Promise.race([Promise.resolve(window.claude && window.claude.use("db")), timeout]);
    } catch (_) {
      db = null;
    }
    if (!db) {
      loaded = true;
      hideSkeleton();
      $("#syncInfo").textContent = "Chưa kết nối dữ liệu";
      $("#syncDot").classList.add("off");
      notice("Chưa kết nối được cơ sở dữ liệu nên chỉ hiện server mặc định. Hãy tải lại trang để thử lại.");
      render();
      return;
    }

    syncTimer = setTimeout(() => {
      if (!loaded) {
        loaded = true;
        hideSkeleton();
        notice("Chưa lấy được danh sách server. Trang sẽ tự cập nhật khi kết nối trở lại.");
        render();
      }
    }, 10000);

    db.collection("links").orderBy("createdAt", "asc").limit(200).onSnapshot(
      (snap) => {
        if (snap.fromCache !== true) clearTimeout(syncTimer);
        items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.title);
        loaded = true;
        $("#notice").hidden = true;
        $("#syncInfo").textContent = `Đã đồng bộ · ${items.length} server`;
        $("#syncDot").classList.remove("off");
        render();
      },
      () => {
        clearTimeout(syncTimer);
        loaded = true;
        hideSkeleton();
        notice("Mất kết nối dữ liệu. Vui lòng tải lại trang.");
        render();
      }
    );
  }


  // ---- Vòng ba: chữ tách ký tự, hạt nổi, parallax, nam châm, tiến trình cuộn ----
  (function polish() {
    // Tách ký tự tiêu đề để hiện từng chữ
    const h1 = $("h1");
    if (h1 && !h1.querySelector(".ch")) {
      const txt = h1.textContent;
      h1.setAttribute("aria-label", txt);
      h1.innerHTML = [...txt].map((c, i) => `<span class="ch" aria-hidden="true" style="--i:${i}">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
    }
    if (reduceMotion) return;

    // Hạt nổi trong nền
    const scene = $("#scene");
    for (let i = 0; i < 18; i++) {
      const m = document.createElement("i");
      m.className = "mote";
      m.style.cssText = `left:${Math.random() * 100}%;--s:${(2 + Math.random() * 4).toFixed(1)}px;--t:${(12 + Math.random() * 14).toFixed(1)}s;--dl:${(-Math.random() * 20).toFixed(1)}s;--dx:${(Math.random() * 80 - 40).toFixed(0)}px`;
      scene.appendChild(m);
    }

    // Vệt sáng + parallax theo con trỏ (chỉ dùng transform, throttle bằng rAF)
    if (matchMedia("(pointer:fine)").matches) {
      const spot = $("#spot"), para = $("#parallax");
      let raf = 0, mx = 0, my = 0, mag = null, ev = null;
      addEventListener("pointermove", (e) => {
        mx = e.clientX; my = e.clientY; ev = e;
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          spot.style.transform = `translate3d(${mx - 520}px, ${my - 520}px, 0)`;
          para.style.transform = `translate3d(${((mx / innerWidth - .5) * 24).toFixed(1)}px, ${((my / innerHeight - .5) * 16).toFixed(1)}px, 0)`;
          // Nút "nam châm"
          const b = ev.target.closest?.(".go, .btn.primary") || null;
          if (mag && mag !== b) mag.style.translate = "";
          mag = b;
          if (b) {
            const r = b.getBoundingClientRect();
            b.style.translate = `${(((mx - r.left) / r.width - .5) * 8).toFixed(1)}px ${(((my - r.top) / r.height - .5) * 6).toFixed(1)}px`;
          }
        });
      }, { passive: true });
      document.documentElement.addEventListener("pointerleave", () => { if (mag) { mag.style.translate = ""; mag = null; } });
    }

    // Thanh tiến trình cuộn + tạm dừng nền khi đang cuộn
    const bar = $("#progress");
    let sraf = 0, st;
    const onScroll = () => {
      if (sraf) return;
      sraf = requestAnimationFrame(() => {
        sraf = 0;
        const max = document.documentElement.scrollHeight - innerHeight;
        bar.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
      });
      document.body.classList.add("scrolling");
      clearTimeout(st); st = setTimeout(() => document.body.classList.remove("scrolling"), 140);
    };
    addEventListener("scroll", onScroll, { passive: true }); onScroll();
  })();

  // Chỉ báo menu: đặt đúng vị trí khi tải, đổi cỡ, nạp xong font
  addEventListener("resize", moveNavInd);
  document.fonts?.ready.then(moveNavInd);
  requestAnimationFrame(moveNavInd);

  render();
  connect();
</script>
